# Le site tourne dans un conteneur nginx derrière Traefik (qui gère le HTTPS)
services:
  portfolio:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    container_name: portfolio
    restart: unless-stopped
    # sécurité : pas de root, système de fichiers en lecture seule, aucune capacité
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # site principal
      - traefik.http.routers.portfolio.rule=Host(`carcagnetom.fr`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls=true
      - traefik.http.routers.portfolio.tls.certresolver=myresolver
      - traefik.http.routers.portfolio.tls.options=modern@file
      - traefik.http.routers.portfolio.tls.domains[0].main=carcagnetom.fr
      - traefik.http.routers.portfolio.tls.domains[0].sans=www.carcagnetom.fr
      - traefik.http.routers.portfolio.middlewares=security-headers@file
      - traefik.http.routers.portfolio.service=portfolio
      - traefik.http.services.portfolio.loadbalancer.server.port=8080
      # www.carcagnetom.fr et carcagnetom.pro redirigent vers https://carcagnetom.fr
      - traefik.http.routers.portfolio-redir.rule=Host(`www.carcagnetom.fr`) || Host(`carcagnetom.pro`) || Host(`www.carcagnetom.pro`)
      - traefik.http.routers.portfolio-redir.entrypoints=websecure
      - traefik.http.routers.portfolio-redir.tls=true
      - traefik.http.routers.portfolio-redir.tls.certresolver=myresolver
      - traefik.http.routers.portfolio-redir.tls.options=modern@file
      - traefik.http.routers.portfolio-redir.tls.domains[0].main=carcagnetom.pro
      - traefik.http.routers.portfolio-redir.tls.domains[0].sans=www.carcagnetom.pro,www.carcagnetom.fr
      - traefik.http.routers.portfolio-redir.middlewares=portfolio-redir
      - traefik.http.routers.portfolio-redir.service=noop@internal
      - traefik.http.middlewares.portfolio-redir.redirectregex.regex=^https?://[^/]+/?(.*)
      - traefik.http.middlewares.portfolio-redir.redirectregex.replacement=https://carcagnetom.fr/$${1}
      - traefik.http.middlewares.portfolio-redir.redirectregex.permanent=true

networks:
  proxy:
    external: true
