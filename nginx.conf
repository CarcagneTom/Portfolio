# Config nginx du portfolio (conteneur non-root sur le port 8080, derrière Traefik)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # HSTS, nosniff, Referrer-Policy, X-Frame-Options : posés par Traefik (security-headers@file)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /index.html { expires -1; }
    location ~* \.(css|js|svg|pdf)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
}
